name: Create Issue on Failure

on:
  workflow_run:
    workflows:
      - "Actionlint"
      - "Cargo Deny"
      - "CI"
      - "Code Coverage"
      - "CodeQL Security Analysis"
      - "Documentation Lint"
      - "Pull Request Labeler"
      - "Release"
      - "Spell Check"
      - "Mark Stale Issues and PRs"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  create-issue:
    name: Create Issue for Failed Workflow
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            const workflowName = run ? run.name : 'Manual Trigger Test';
            const htmlUrl = run ? run.html_url : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const headBranch = run ? run.head_branch : context.ref;
            const headSha = run ? run.head_sha : context.sha;
            const event = run ? run.event : context.eventName;

            const shortSha = headSha ? headSha.substring(0, 7) : 'unknown';
            const title = `[CI Failure] ${workflowName} failed on ${headBranch}`;

            try {
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'ci'
              });

              const duplicate = existingIssues.data.find(issue => issue.title === title);
              if (duplicate) {
                core.info(`An open issue already exists for this failure: ${duplicate.html_url}`);
                return;
              }
            } catch (err) {
              core.warning(`Failed to check existing issues: ${err.message}. Proceeding to create issue.`);
            }

            const body = `### ❌ Workflow Failure Report

            An automated workflow run has failed.

            - **Workflow:** ${workflowName}
            - **Trigger Event:** \`${event}\`
            - **Branch:** \`${headBranch}\`
            - **Commit:** \`${shortSha}\`
            - **Workflow Run Logs:** [View Run Logs](${htmlUrl})

            Please inspect the workflow run logs to diagnose and resolve the failure.`;

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci']
              });
              core.info('Issue created successfully with "ci" label.');
            } catch (err) {
              core.warning(`Failed to create issue with labels: ${err.message}. Retrying without labels.`);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });
              core.info('Issue created successfully without labels.');
            }
