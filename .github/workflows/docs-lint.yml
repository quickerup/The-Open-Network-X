name: Documentation Lint

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
      - work
    paths:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Markdown Link & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          folder-path: '.'
          config-file: '.github/mlc_config.json'

      - name: Verify Specification Structure Rules
        run: |
          python3 -c "
          import os, sys

          spec_dir = 'docs/specification'
          if not os.path.exists(spec_dir):
              sys.exit(0)

          required_sections = [
              'Reference',
              'Requirement',
              'ONX interpretation',
              'Serialization',
              'Malformed-input behavior',
              'Test plan'
          ]

          errors = []
          for root, dirs, files in os.walk(spec_dir):
              for file in files:
                  if file.endswith('.md') and file != 'architecture.md':
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      for sec in required_sections:
                          if sec.lower() not in content.lower():
                              errors.append(f'{path} missing required section: {sec}')

          if errors:
              for err in errors:
                  print(f'ERROR: {err}')
              sys.exit(1)
          print('All specification documents comply with required section guidelines.')
          "
