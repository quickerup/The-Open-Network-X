name: Spec Tracker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  track:
    name: Verify Spec and Log Progress
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert WHITEPAPER.md exists
        run: |
          if [ ! -f "WHITEPAPER.md" ]; then
            echo "::error file=WHITEPAPER.md::WHITEPAPER.md not found at repo root. Spec verification failed."
            exit 1
          fi
          echo "WHITEPAPER.md found."

      - name: Determine commit metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Fall back to the single commit's own diff if there's no usable
          # "before" ref (e.g. first push of a new branch, base sha all zeros).
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            MODIFIED_FILES=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          else
            MODIFIED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          {
            echo "commit_hash=$HEAD_SHA"
            echo "timestamp=$TIMESTAMP"
          } >> "$GITHUB_OUTPUT"

          # Multi-line output for the file list
          {
            echo "modified_files<<EOF"
            echo "$MODIFIED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Append entry to docs/generated/spec-tracker-log.md
        run: |
          mkdir -p docs/generated
          if [ ! -f "docs/generated/spec-tracker-log.md" ]; then
            {
              echo "# Spec Tracker Research Log"
              echo ""
              echo "Automated log of commits tracked against WHITEPAPER.md."
              echo ""
            } > docs/generated/spec-tracker-log.md
          fi

          {
            echo "## Commit ${{ steps.meta.outputs.commit_hash }}"
            echo ""
            echo "- **Timestamp:** ${{ steps.meta.outputs.timestamp }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Modified files:**"
            if [ -z "${{ steps.meta.outputs.modified_files }}" ]; then
              echo "  - (none detected)"
            else
              echo "${{ steps.meta.outputs.modified_files }}" | sed 's/^/  - /'
            fi
            echo ""
          } >> docs/generated/spec-tracker-log.md

      - name: Commit and push updated log
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/generated/spec-tracker-log.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: log spec-tracker entry for ${{ steps.meta.outputs.commit_hash }} [skip ci]"
            git push
          fi

      - name: Summarize on pull requests
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Spec Tracker"
            echo ""
            echo "- **Commit:** ${{ steps.meta.outputs.commit_hash }}"
            echo "- **Timestamp:** ${{ steps.meta.outputs.timestamp }}"
            echo "- **Modified files:**"
            echo '```'
            echo "${{ steps.meta.outputs.modified_files }}"
            echo '```'
            echo ""
            echo "_Log entry will be committed to docs/generated/spec-tracker-log.md once merged to main._"
          } >> "$GITHUB_STEP_SUMMARY"
          
