[package]
name = "onx-telemetry"
version = "0.1.0"
edition = "2021"
description = "ONX telemetry, metrics, and tracing scaffolding for node and consensus integration"
license = "Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
prometheus = "0.13"
tracing = "0.1"
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry-otlp = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
