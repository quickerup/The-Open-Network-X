[package]
name = "onx-payment-channels"
version = "0.1.0"
edition = "2021"
description = "ONX payment channels and off-chain payment networks per docs/specification/payment-channels.md"
license = "Apache-2.0"
publish = false

[dependencies]
onx-primitives = { path = "../onx-primitives" }
onx-data-structures = { path = "../onx-data-structures" }
onx-state-model = { path = "../onx-state-model" }
onx-transactions = { path = "../onx-transactions" }
onx-execution = { path = "../onx-execution" }
tokio = { version = "1.38", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
hex = "0.4"
