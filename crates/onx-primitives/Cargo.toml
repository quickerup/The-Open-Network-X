[package]
name = "onx-primitives"
version = "0.1.0"
edition = "2021"
description = "ONX protocol primitives: canonical integer/bytestring encoding, domain-separated SHA-256 hashing, and Ed25519 signing per docs/specification/protocol-primitives.md"
license = "MIT"
publish = false

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[dev-dependencies]
hex = "0.4"
